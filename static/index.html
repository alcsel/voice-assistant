<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Assistant — Recorder</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e8eaf0;
    --muted: #9aa3b2;
    --accent: #4f9cf9;
    --danger: #e5534b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    width: min(640px, 92vw);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
  }
  h1 { margin: 0 0 .25rem; font-size: 1.35rem; }
  p.subtitle { margin: 0 0 1.75rem; color: var(--muted); font-size: .9rem; }
  button {
    width: 100%;
    padding: .9rem 1.25rem;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #06101f;
    cursor: pointer;
    transition: filter .15s ease;
  }
  button:hover { filter: brightness(1.08); }
  button.recording { background: var(--danger); color: #fff; }
  button:disabled { opacity: .55; cursor: progress; }
  .status { margin: 1rem 0 0; font-size: .85rem; color: var(--muted); min-height: 1.2rem; }
  .status.error { color: var(--danger); }
  textarea {
    width: 100%;
    margin-top: 1.25rem;
    min-height: 160px;
    padding: .85rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0c0e13;
    color: var(--text);
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    font-size: .9rem;
    resize: vertical;
  }
  .actions { display: flex; gap: .75rem; margin-top: .75rem; }
  .actions button { width: auto; flex: 1; font-size: .85rem; padding: .6rem 1rem; }
  .actions button.secondary { background: var(--border); color: var(--text); }
  audio { width: 100%; margin-top: 1.25rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Voice Assistant</h1>
  <p class="subtitle">Record a question, send it for transcription and copy the result.</p>

  <button id="record" type="button">Start recording</button>
  <p id="status" class="status">Microphone is idle.</p>

  <audio id="playback" controls hidden></audio>

  <textarea id="transcript" placeholder="The transcript will appear here." aria-label="Transcript"></textarea>
  <div class="actions">
    <button id="copy" class="secondary" type="button">Copy</button>
    <button id="download" class="secondary" type="button">Download</button>
  </div>
</main>

<script>
const ENDPOINT = "/api/transcribe";

const recordButton = document.getElementById("record");
const statusLine = document.getElementById("status");
const transcriptBox = document.getElementById("transcript");
const playback = document.getElementById("playback");
const copyButton = document.getElementById("copy");
const downloadButton = document.getElementById("download");

let recorder = null;
let chunks = [];

function setStatus(message, isError = false) {
  statusLine.textContent = message;
  statusLine.classList.toggle("error", isError);
}

function pickMimeType() {
  const candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"];
  return candidates.find(type => MediaRecorder.isTypeSupported(type)) || "";
}

async function upload(blob) {
  setStatus("Uploading the recording…");
  const body = new FormData();
  body.append("audio", blob, "recording.webm");

  const response = await fetch(ENDPOINT, { method: "POST", body });
  const text = await response.text();

  if (!response.ok) {
    let detail = text;
    try {
      detail = JSON.parse(text).error || text;
    } catch (ignored) {
      detail = text;
    }
    throw new Error(detail || `Request failed with status ${response.status}`);
  }

  return text;
}

recordButton.addEventListener("click", async () => {
  if (recorder && recorder.state === "recording") {
    recorder.stop();
    return;
  }

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (error) {
    setStatus(`Microphone access was refused: ${error.message}`, true);
    return;
  }

  chunks = [];
  recorder = new MediaRecorder(stream, pickMimeType() ? { mimeType: pickMimeType() } : undefined);

  recorder.addEventListener("dataavailable", event => {
    if (event.data.size > 0) {
      chunks.push(event.data);
    }
  });

  recorder.addEventListener("stop", async () => {
    stream.getTracks().forEach(track => track.stop());
    recordButton.textContent = "Start recording";
    recordButton.classList.remove("recording");

    if (chunks.length === 0) {
      setStatus("Nothing was captured. Check that the microphone works.", true);
      return;
    }

    const blob = new Blob(chunks, { type: chunks[0].type });
    playback.src = URL.createObjectURL(blob);
    playback.hidden = false;

    try {
      transcriptBox.value = await upload(blob);
      setStatus("Transcription finished.");
    } catch (error) {
      setStatus(error.message, true);
    }
  });

  recorder.start();
  recordButton.textContent = "Stop recording";
  recordButton.classList.add("recording");
  setStatus("Recording… press the button again when you are done.");
});

copyButton.addEventListener("click", async () => {
  if (!transcriptBox.value) {
    setStatus("There is nothing to copy yet.", true);
    return;
  }
  await navigator.clipboard.writeText(transcriptBox.value);
  setStatus("Transcript copied to the clipboard.");
});

downloadButton.addEventListener("click", () => {
  if (!transcriptBox.value) {
    setStatus("There is nothing to download yet.", true);
    return;
  }
  const blob = new Blob([transcriptBox.value], { type: "text/plain;charset=utf-8" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "transcript.txt";
  link.click();
  URL.revokeObjectURL(link.href);
});
</script>
</body>
</html>
